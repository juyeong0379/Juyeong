name: Daily News Briefing

on:
  # Start at 07:30 KST, aim to publish by 08:00; retry at 07:45 if thin/failed.
  # Both calls use the SAME fixed prior-day 07:30–today 07:30 publication window.
  # GitHub Actions scheduling/Pages delivery can be delayed; 08:00 is a target.
  schedule:
    - cron: "30 22 * * *"  # Daily 07:30 KST initial
    - cron: "45 22 * * *"  # Daily 07:45 KST coverage/deployment retry
  workflow_dispatch: {}
  # Scoped, explicit emergency refresh; unrelated commits never spend API credits.
  push:
    branches: [main]
    paths:
      - '.github/briefing-refresh-request.txt'

concurrency:
  group: ib-daily-briefing
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  build-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 동일 회차 자동 중복 실행 방지
        id: current
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Seoul"))
          edition = "0730"
          try:
              data = json.loads(Path("docs/data.json").read_text(encoding="utf-8"))
              todays = str(data.get("generated_at", "")).startswith(now.date().isoformat())
              completed = data.get("editions_completed", [])
          except (OSError, ValueError, TypeError):
              todays, completed = False, []
          # Never let an early manual draft suppress the full cutoff-time run.
          deadline = now.replace(hour=7, minute=30, second=0, microsecond=0)
          try:
              stamp = str(data.get("generated_at", "")).replace(" KST", "")
              published_at = datetime.strptime(stamp, "%Y-%m-%d %H:%M").replace(tzinfo=now.tzinfo)
          except (NameError, ValueError, TypeError):
              published_at = now.replace(year=2000)
          # Retry whenever any of the eleven desks is below the target of TWO.
          # Never treat a one-article section as complete.
          groups = data.get("categories", {}) if todays else {}
          enough = sum(len(items) >= 2 for items in groups.values())
          skip = (os.getenv("EVENT_NAME") == "schedule"
                  and todays and edition in completed and published_at >= deadline
                  and enough == 11)
          print(f"covered_with_2_or_more={enough}/11")
          print("skip=" + ("true" if skip else "false"))
          print(f"edition={edition}")
          PY

      - name: Python 설치
        if: steps.current.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        if: steps.current.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 파이썬 코드 사전 검증
        if: steps.current.outputs.skip != 'true'
        run: |
          python -m py_compile scripts/generate_briefing.py scripts/sector_rules.py scripts/news_quality.py scripts/report_sources.py scripts/rss_sources.py
          python -m unittest discover -s scripts -p 'test_briefing_rules.py'
          python -m unittest discover -s scripts -p 'test_report_sources.py'
          python -m unittest discover -s scripts -p 'test_rss_sources.py'
          python scripts/test_news_quality.py

      - name: 브리핑 생성 (뉴스 수집 + OpenAI 분석)
        id: generate
        if: steps.current.outputs.skip != 'true'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is missing; existing published news will be preserved."
            exit 1
          fi
          python scripts/generate_briefing.py

      - name: 게시 전 뉴스 무결성 점검 (최근 24시간·카테고리별 3건·중복·3줄 요약)
        id: validate
        if: steps.current.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json, sys
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from briefing_windows import (
              KST, EDITION_ORDER, PER_EDITION_LIMIT,
              MAX_STORIES_PER_CATEGORY, in_edition_window, in_day_window,
              edition_for_published,
          )
          from news_quality import repeated_without_update

          data = json.loads(Path("docs/data.json").read_text(encoding="utf-8"))
          now = datetime.now(KST)
          today = now.date().isoformat()
          if not str(data.get("generated_at", "")).startswith(today):
              raise RuntimeError("오늘자 브리핑이 아닙니다.")

          prior_path = Path("docs/archive") / (
              (now.date() - timedelta(days=1)).isoformat() + ".json"
          )
          previous_day = []
          previous_report_urls = set()
          if prior_path.exists():
              older = json.loads(prior_path.read_text(encoding="utf-8"))
              previous_day = [a for group in older.get("categories", {}).values() for a in group]
              previous_report_urls = {r.get("url") for r in older.get("reports", []) if r.get("url")}
          report_urls = set()
          for report in data.get("reports", []):
              url = report.get("url", "")
              if not url.startswith("https://") or url in previous_report_urls:
                  raise RuntimeError("기관 보고서 원문 미검증 또는 전일 자료 반복")
              if url in report_urls:
                  raise RuntimeError("같은 보고서를 오늘 중복 게재")
              report_urls.add(url)

          seen = []
          for section, group in data["categories"].items():
              if len(group) > MAX_STORIES_PER_CATEGORY:
                  raise RuntimeError(f"{section}: 3건 초과")
              for edition in EDITION_ORDER:
                  count = sum(a.get("edition") == edition for a in group)
                  if count > PER_EDITION_LIMIT:
                      raise RuntimeError(f"{section}: 3건 초과")
              for item in group:
                  facts = item.get("summary", [])
                  if item.get("summary_mode") == "source_excerpt":
                      if len(facts) != 1 or len(facts[0]) < 65:
                          raise RuntimeError(f"{section}: 출처 설명 발췌 검증 미충족")
                  elif len(facts) != 3:
                      raise RuntimeError(f"{section}: 3줄 원문·AI 요약 미충족")
                  if not str(item.get("url", "")).startswith(("https://", "http://")):
                      raise RuntimeError(f"{section}: 원문 링크 누락")
                  exact = str(item.get("publishedAt") or "").strip()
                  if exact:
                      published = datetime.fromisoformat(exact).astimezone(KST)
                  else:
                      timestamp = str(item.get("pubDate", "")) + " " + str(item.get("pubTime", "")).replace(" KST", "")
                      published = datetime.strptime(timestamp, "%Y-%m-%d %H:%M").replace(tzinfo=KST)
                  if not in_day_window(published, now):
                      raise RuntimeError(f"{section}: 발행 시각이 오늘의 수집 범위 밖")
                  edition = item.get("edition")
                  if edition not in EDITION_ORDER or not in_edition_window(published, now, edition):
                      raise RuntimeError(f"{section}: 오전 07:30 기준 24시간 발행 범위 위반")
                  candidate = {"title": item.get("headline", ""), "url": item["url"]}
                  if any(repeated_without_update(candidate, old) for old in previous_day):
                      raise RuntimeError(f"{section}: 전일 기사 또는 신규 사실 없는 반복 기사")
                  if any(repeated_without_update(candidate, old) for old in seen):
                      raise RuntimeError(f"{section}: 당일 동일 이슈 중복")
                  seen.append(candidate)
          insufficient = {key: len(group) for key, group in data["categories"].items() if len(group) < 2}
          if insufficient:
              print("::warning::카테고리별 2건 미달 (실제 기사가 없으면 임의 생성 금지): "
                    + json.dumps(insufficient, ensure_ascii=False))
          print(f"정상: {today} | {len(seen)}건 | 기관자료 {len(report_urls)}건 | 24시간·중복 검사 완료")
          PY

      - name: 결과 커밋 & 푸시
        id: publish
        if: steps.current.outputs.skip != 'true'
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs/data.json docs/archive
          git diff --staged --quiet || git commit -m "chore: 데일리 브리핑 업데이트 $(date +'%Y-%m-%d')"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Request GitHub Pages refresh for updated news
        id: pages
        if: steps.current.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"

      - name: 실행 결과 진단 기록 (게시 실패도 저장)
        if: ${{ always() && steps.current.outputs.skip != 'true' }}
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Seoul")).strftime("%Y-%m-%d %H:%M KST")
          outcomes = {
              key: os.getenv(key + "_OUTCOME", "unknown")
              for key in ("GENERATE", "VALIDATE", "PUBLISH", "PAGES")
          }
          published = outcomes.get("PUBLISH") == "success"
          current_data = Path("docs/data.json")
          try:
              payload = json.loads(current_data.read_text(encoding="utf-8"))
              totals = {key: len(items) for key, items in payload.get("categories", {}).items()}
              generated = payload.get("generated_at", "")
          except (OSError, ValueError, TypeError, AttributeError):
              totals, generated = {}, ""
          result = {
              "attempted_at": now,
              "state": "published" if published else "failed",
              "run_url": "https://github.com/" + os.getenv("REPOSITORY", "") +
                         "/actions/runs/" + os.getenv("RUN_ID", ""),
              "steps": outcomes,
              "data_generated_at": generated,
              "article_counts": totals,
          }
          path = Path("docs/briefing-status.json")
          path.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
          # A failed validation may leave edited news locally: never commit it.
          git restore -- docs/data.json docs/archive 2>/dev/null || true
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs/briefing-status.json
          git diff --staged --quiet || git commit -m "chore: record IB briefing run outcome"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
