name: Daily News Briefing

on:
  schedule:
    # 매일 07:30 KST 수집 시작, 08:00 KST 게시 목표 (전날 22:30 UTC)
    - cron: "30 22 * * *"
  workflow_dispatch: {}

concurrency:
  group: ib-daily-briefing
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  build-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 브리핑 생성 (뉴스 수집 + Claude 분석)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_briefing.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs/data.json docs/archive
          git diff --staged --quiet || git commit -m "chore: 데일리 브리핑 업데이트 $(date +'%Y-%m-%d')"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Request GitHub Pages refresh for updated news
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
