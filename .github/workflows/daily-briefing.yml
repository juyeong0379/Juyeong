name: Daily News Briefing

on:
  # GitHub schedule can be delayed: run earlier, with independent backup slots.
  # The first successful publication wins for the KST date.
  schedule:
    - cron: "20 20 * * *"  # 05:20 KST primary
    - cron: "10 21 * * *"  # 06:10 KST backup
    - cron: "45 21 * * *"  # 06:45 KST final backup
  workflow_dispatch: {}
  # Scoped, explicit emergency refresh; unrelated commits never spend API credits.
  push:
    branches: [main]
    paths:
      - '.github/briefing-refresh-request.txt'

concurrency:
  group: ib-daily-briefing
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  build-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 오늘자 뉴스 기게시 여부 확인 (중복 API 호출 방지)
        id: current
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p = Path("docs/data.json")
          today = datetime.now(ZoneInfo("Asia/Seoul")).strftime("%Y-%m-%d")
          try:
              payload = json.loads(p.read_text(encoding="utf-8"))
              published = str(payload.get("generated_at", "")).startswith(today)
              count = sum(len(items) for items in payload.get("categories", {}).values())
          except (ValueError, OSError, AttributeError):
              published, count = False, 0
          skip = published and count > 0
          print(f"skip={'true' if skip else 'false'}")
          PY

      - name: Python 설치
        if: steps.current.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        if: steps.current.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 브리핑 생성 (뉴스 수집 + OpenAI 분석)
        if: steps.current.outputs.skip != 'true'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is missing; existing published news will be preserved."
            exit 1
          fi
          python scripts/generate_briefing.py

      - name: 게시 전 뉴스 무결성 점검 (KST 날짜·3줄 요약·중복)
        if: steps.current.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          data = json.loads(Path("docs/data.json").read_text(encoding="utf-8"))
          today = datetime.now(ZoneInfo("Asia/Seoul")).strftime("%Y-%m-%d")
          if not str(data.get("generated_at", "")).startswith(today):
              raise RuntimeError("오늘자 뉴스가 아니므로 기존 배포 데이터를 유지합니다.")
          stories = [item for group in data["categories"].values() for item in group]
          if not stories:
              raise RuntimeError("게시 가능한 뉴스가 없어 기존 데이터를 유지합니다.")
          urls = [item.get("url", "") for item in stories]
          if not all(urls) or len(urls) != len(set(urls)):
              raise RuntimeError("원문 링크 누락 또는 중복 발견")
          for section, group in data["categories"].items():
              if len(group) > 3:
                  raise RuntimeError(f"{section}: 섹터별 3건 초과")
              for item in group:
                  if len(item.get("summary", [])) != 3:
                      raise RuntimeError(f"{section}: 3줄 요약 미충족")
          print(f"검증 완료: {today} | {len(stories)}건 | 기존 원문 URL 유지")
          PY

      - name: 결과 커밋 & 푸시
        if: steps.current.outputs.skip != 'true'
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs/data.json docs/archive
          git diff --staged --quiet || git commit -m "chore: 데일리 브리핑 업데이트 $(date +'%Y-%m-%d')"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Request GitHub Pages refresh for updated news
        if: steps.current.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
