name: Validate and Repair IB Sector Categories

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reclassify_archives.py'
  workflow_dispatch: {}

concurrency:
  group: ib-daily-briefing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reclassify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run sector boundary tests
        run: |
          python -m py_compile scripts/sector_rules.py scripts/generate_briefing.py scripts/backfill_week.py scripts/reclassify_archives.py
          cd scripts && python test_sector_rules.py
      - name: Reclassify current and seven-day archives
        run: python scripts/reclassify_archives.py
      - name: Commit correction
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs/data.json docs/archive
          if ! git diff --staged --quiet; then
            git commit -m "fix: IB 뉴스 실제 사업분야 기준으로 재분류"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
